<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>SerpScoop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="logo">◉</span>
        <span class="title">SerpScoop</span>
      </div>
      <div class="actions">
        <button id="runBtn" class="btn primary" title="Run extraction">▶ Run</button>
      </div>
    </header>

    <!-- Stats Row -->
    <div class="stats">
      <div class="stat"><span id="totalEmails">0</span><label>Emails</label></div>
      <div class="stat"><span id="pagesCount">0</span><label>Pages</label></div>
      <div class="stat queue"><span id="queueCount">0</span><label>Queue</label></div>
      <div class="stat"><span id="linksCount">0</span><label>Links</label></div>
    </div>

    <!-- Queue Status -->
    <div id="queueStatus" class="queue-bar hidden">
      <div class="queue-progress"><div id="queueFill" class="queue-fill"></div></div>
      <span id="queueText">Processing...</span>
    </div>

    <!-- Filter -->
    <div class="filter">
      <input type="text" id="filterInput" placeholder="Filter: @domain.com">
    </div>

    <!-- Results -->
    <div class="results">
      <div class="section primary" id="primarySection">
        <div class="section-header">
          <span>★ Matches</span>
          <span id="matchCount" class="badge">0</span>
        </div>
        <div id="primaryList" class="list"></div>
      </div>
      <div class="section">
        <div class="section-header">
          <span>All Results</span>
          <span id="allCount" class="badge">0</span>
        </div>
        <div id="allList" class="list"></div>
      </div>
    </div>

    <!-- Footer Actions -->
    <footer class="footer">
      <button id="copyBtn" class="btn sm" title="Copy emails">Copy</button>
      <button id="downloadBtn" class="btn sm" title="Download CSV">Export</button>
      <button id="clearBtn" class="btn sm danger" title="Clear all">Clear</button>
    </footer>
  </div>

  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
